server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  types { application/manifest+json webmanifest; }

  # Service worker, su índice e index.html sin caché: así se detectan las nuevas versiones (PWA)
  location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|index\.html)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|png|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
